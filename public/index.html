<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word 文档解析服务</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 600px;
      padding: 40px;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    .upload-area {
      border: 3px dashed #ddd;
      border-radius: 15px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #f8f9fa;
      position: relative;
    }

    .upload-area:hover {
      border-color: #667eea;
      background: #f0f1ff;
    }

    .upload-area.dragover {
      border-color: #667eea;
      background: #e8eaff;
      transform: scale(1.02);
    }

    .upload-icon {
      font-size: 60px;
      margin-bottom: 15px;
    }

    .upload-text {
      color: #666;
      font-size: 16px;
    }

    .upload-text span {
      color: #667eea;
      font-weight: 600;
    }

    .file-input {
      display: none;
    }

    .file-name {
      margin-top: 15px;
      padding: 10px 20px;
      background: #e8eaff;
      border-radius: 25px;
      color: #667eea;
      font-size: 14px;
      display: none;
    }

    .file-name.show {
      display: inline-block;
    }

    .district-select {
      margin-top: 25px;
    }

    .district-select label {
      display: block;
      color: #333;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .district-select select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      color: #333;
      background: white;
      cursor: pointer;
      transition: border-color 0.3s ease;
    }

    .district-select select:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .result-area {
      margin-top: 30px;
      display: none;
    }

    .result-area.show {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px;
      background: #e8f5e9;
      border-radius: 10px;
      color: #2e7d32;
      margin-bottom: 15px;
    }

    .result-content {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 20px;
      max-height: 400px;
      overflow-y: auto;
    }

    .result-content pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      color: #333;
    }

    .result-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .result-tab {
      padding: 8px 16px;
      border: none;
      background: #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .result-tab.active {
      background: #667eea;
      color: white;
    }

    .result-tab:hover:not(.active) {
      background: #d0d0d0;
    }

    #previewContent {
      line-height: 1.8;
    }

    .copy-btn {
      margin-top: 15px;
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .copy-btn:hover {
      background: #5a6fd6;
    }

    .error-msg {
      background: #ffebee;
      color: #c62828;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      display: none;
    }

    .error-msg.show {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 40px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      color: #666;
      font-size: 14px;
    }

    .endpoints {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .endpoints h3 {
      color: #333;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .endpoint-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .endpoint-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .method {
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
    }

    .method-get {
      background: #e3f2fd;
      color: #1565c0;
    }

    .method-post {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .endpoint-url {
      color: #666;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Word 文档解析服务</h1>
      <p>支持 .docx 和 .doc 格式的文档解析</p>
    </div>

    <form id="uploadForm">
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📄</div>
        <div class="upload-text">
          拖拽文件到此处或 <span>点击选择</span>
        </div>
        <div class="file-name" id="fileName"></div>
        <input type="file" class="file-input" id="fileInput" accept=".docx,.doc">
      </div>

      <div class="district-select">
        <label for="district">选择区域（可选）</label>
        <select id="district" name="district">
          <option value="">-- 不选择 --</option>
          <option value="mh">闵行区</option>
          <option value="sj">松江区</option>
          <option value="xh">徐汇区</option>
          <option value="pd">浦东新区</option>
          <option value="fx">奉贤区</option>
          <option value="ja">嘉定区</option>
          <option value="pt">普陀区</option>
          <option value="ja2">静安区</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn" disabled>
        开始解析
      </button>
    </form>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text">正在解析文档...</div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="result-area" id="resultArea">
      <div class="result-header">
        <span>✓</span>
        <span>解析成功</span>
      </div>
      <div class="result-tabs">
        <button class="result-tab active" data-tab="preview">预览效果</button>
        <button class="result-tab" data-tab="code">代码格式</button>
      </div>
      <div class="result-content">
        <div id="previewContent"></div>
        <pre id="codeContent" style="display:none;"></pre>
      </div>
      <button class="copy-btn" id="copyBtn">复制代码</button>
    </div>


  </div>

  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const district = document.getElementById('district');
    const submitBtn = document.getElementById('submitBtn');
    const uploadForm = document.getElementById('uploadForm');
    const loading = document.getElementById('loading');
    const resultArea = document.getElementById('resultArea');
    const previewContent = document.getElementById('previewContent');
    const codeContent = document.getElementById('codeContent');
    const errorMsg = document.getElementById('errorMsg');
    const copyBtn = document.getElementById('copyBtn');

    let selectedFile = null;
    let currentCodeData = '';

    // Tab 切换
    document.querySelectorAll('.result-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.result-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        if (tab.dataset.tab === 'preview') {
          previewContent.style.display = 'block';
          codeContent.style.display = 'none';
        } else {
          previewContent.style.display = 'none';
          codeContent.style.display = 'block';
        }
      });
    });

    // 点击上传区域触发文件选择
    uploadArea.addEventListener('click', () => {
      fileInput.click();
    });

    // 文件拖拽
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFile(files[0]);
      }
    });

    // 文件选择
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        handleFile(fileInput.files[0]);
      }
    });

    function handleFile(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      if (ext !== 'docx' && ext !== 'doc') {
        showError('请上传 Word 文档 (.docx 或 .doc)');
        return;
      }
      selectedFile = file;
      fileName.textContent = file.name;
      fileName.classList.add('show');
      submitBtn.disabled = false;
      hideError();
    }

    // 提交表单
    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!selectedFile) return;

      hideError();
      hideResult();
      showLoading();

      const formData = new FormData();
      formData.append('file', selectedFile);
      if (district.value) {
        formData.append('districtName', district.value);
      }

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData,
        });

        const data = await response.json();

        if (data.success) {
          showResult(data.data);
        } else {
          showError(data.message || '解析失败');
        }
      } catch (err) {
        showError('网络错误: ' + err.message);
      } finally {
        hideLoading();
      }
    });

    // 复制结果
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(currentCodeData).then(() => {
        copyBtn.textContent = '已复制!';
        setTimeout(() => {
          copyBtn.textContent = '复制代码';
        }, 2000);
      });
    });

    function showLoading() {
      loading.classList.add('show');
      submitBtn.disabled = true;
    }

    function hideLoading() {
      loading.classList.remove('show');
      if (selectedFile) {
        submitBtn.disabled = false;
      }
    }

    function showResult(data) {
      resultArea.classList.add('show');

      // 获取 HTML 内容
      let htmlContent = '';
      if (data.richText && data.richText.htmlContent) {
        htmlContent = data.richText.htmlContent;
      } else if (data.result) {
        htmlContent = data.result.fullText || '';
      }

      // 生成代码格式
      if (data.richText && data.richText.codeFormat) {
        currentCodeData = data.richText.codeFormat;
      } else {
        currentCodeData = "'" + htmlContent.replace(/'/g, "\\'") + "'";
      }

      // 显示预览和代码
      previewContent.innerHTML = htmlContent;
      codeContent.textContent = currentCodeData;

      // 默认显示预览
      document.querySelector('.result-tab[data-tab="preview"]').click();
    }

    function hideResult() {
      resultArea.classList.remove('show');
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
    }

    function hideError() {
      errorMsg.classList.remove('show');
    }
  </script>
</body>
</html>
